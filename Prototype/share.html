<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Your drawing · Push'n'Pray</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffe193">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,900,100&family=Figtree:wght@500;600;700;800&display=swap" rel="stylesheet">
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #fff4b3;
    --surface: #fffbf3;
    --ink: #2e2745;
    --muted: #5f587a;
    --yellow: #ffe193;
    --lavender: #cdbef2;
    --line: #e2cc6b;
    --display: "Fraunces", "Cooper Black", "Baskerville", Georgia, serif;
    --sans: "Figtree", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    /* the same ruled yellow notepad page as the app */
    background:
      linear-gradient(to right, transparent 27px, rgba(229, 72, 77, 0.5) 27px, rgba(229, 72, 77, 0.5) 29px, transparent 29px),
      repeating-linear-gradient(to bottom, transparent 0, transparent 35px, rgba(61, 111, 216, 0.22) 35px, rgba(61, 111, 216, 0.22) 36px),
      var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    display: flex;
    justify-content: center;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
  }
  main {
    width: 100%;
    max-width: 560px;
    text-align: center;
  }
  .brand { font-weight: 700; font-size: 0.95rem; letter-spacing: 0.04em; color: var(--muted); margin: 8px 0 4px; }
  h1 {
    font-family: var(--display);
    font-weight: 900;
    font-size: 1.7rem;
    margin: 0 0 4px;
    line-height: 1.2;
    display: inline-block;
    padding: 0 0.25em;
    background: linear-gradient(transparent 60%, var(--yellow) 60% 92%, transparent 92%);
  }
  .sub { color: var(--muted); margin: 6px 0 22px; }
  .frame {
    position: relative;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: 0 8px 22px rgba(120, 90, 0, 0.16);
    padding: 8px;
    min-height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .frame::before {
    content: "";
    position: absolute;
    top: -13px;
    left: 50%;
    width: 100px;
    height: 26px;
    margin-left: -50px;
    background: rgba(255, 225, 147, 0.92);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.14);
    transform: rotate(-2.5deg);
  }
  .frame img { width: 100%; height: auto; display: block; }
  .btn {
    display: inline-block;
    margin-top: 20px;
    background: var(--yellow);
    color: var(--ink);
    border: 2px solid var(--ink);
    box-shadow: 0 3px 0 var(--ink);
    border-radius: 999px;
    padding: 12px 32px;
    font-family: var(--sans);
    font-weight: 700;
    font-size: 1.1rem;
    text-decoration: none;
  }
  .hint { color: var(--muted); font-size: 0.9rem; margin-top: 14px; line-height: 1.4; }
  .state { color: var(--muted); padding: 40px 16px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <main>
    <p class="brand">Push'n'Pray</p>
    <h1 id="title">Your drawing</h1>
    <p class="sub" id="sub">Made together at the library</p>

    <div class="frame">
      <div class="state" id="state">Loading your drawing&hellip;</div>
      <img id="img" alt="Your drawing" hidden>
    </div>

    <a class="btn" id="save" hidden>Save image</a>
    <p class="hint" id="hint" hidden>Or press and hold the image, then choose <strong>Save to Photos</strong>.</p>
  </main>
  <!-- Versioned loading. GitHub Pages tells browsers to keep every file for 10
     minutes, and each file is cached on its own, so right after a deploy a
     device can end up with the NEW page but an OLD script or stylesheet (broken
     layout, missing features). This asks the server which deploy is current
     (every file in a deploy shares one Last-Modified) and requests each file as
     ?v=<that>, so a new deploy always means new URLs and mixed versions can't
     happen. If anything here fails it falls back to plain URLs.
     When you add a module under src/, add it to MODULES below. -->
<script>
(function () {
  var MODULES = ["firebase-config.js", "prompts.js", "realtime.js", "share.js"];
  var started = false;
  function start(v) {
    if (started) return;
    started = true;
    var q = v ? "?v=" + v : "";
    // The modules read the page as soon as they run, so wait until it is parsed.
    function run() {
      // The import map makes the modules' own imports carry the version too.
      if (v && typeof HTMLScriptElement.supports === "function" && HTMLScriptElement.supports("importmap")) {
        var imports = {};
        MODULES.forEach(function (m) { imports["./src/" + m] = "./src/" + m + q; });
        var map = document.createElement("script");
        map.type = "importmap";
        map.textContent = JSON.stringify({ imports: imports });
        document.head.appendChild(map);
      }
      var entry = document.createElement("script");
      entry.type = "module";
      entry.src = "src/share.js" + q;
      document.head.appendChild(entry);
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", run);
    else run();
  }
  var timer = setTimeout(function () { start(""); }, 2500); // never hold the app hostage to a slow request
  fetch(location.href, { method: "HEAD", cache: "no-store" })
    .then(function (r) { return (r.headers.get("last-modified") || r.headers.get("etag") || "").replace(/[^a-z0-9]/gi, ""); })
    .catch(function () { return ""; })
    .then(function (v) { clearTimeout(timer); start(v); });
})();
</script>
</body>
</html>
