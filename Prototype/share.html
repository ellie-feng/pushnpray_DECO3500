<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Your drawing · Push'n'Pray</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd23f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,900,100&family=Figtree:wght@500;600;700;800&display=swap" rel="stylesheet">
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #fff4b3;
    --surface: #fffbf3;
    --ink: #2e2745;
    --muted: #5f587a;
    --yellow: #ffd23f;
    --lavender: #cdbef2;
    --line: #e2cc6b;
    --display: "Fraunces", "Cooper Black", "Baskerville", Georgia, serif;
    --sans: "Figtree", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    /* the same ruled yellow notepad page as the app */
    background:
      linear-gradient(to right, transparent 27px, rgba(229, 72, 77, 0.5) 27px, rgba(229, 72, 77, 0.5) 29px, transparent 29px),
      repeating-linear-gradient(to bottom, transparent 0, transparent 35px, rgba(61, 111, 216, 0.22) 35px, rgba(61, 111, 216, 0.22) 36px),
      var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    display: flex;
    justify-content: center;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
  }
  main {
    width: 100%;
    max-width: 560px;
    text-align: center;
  }
  .brand { font-weight: 700; font-size: 0.95rem; letter-spacing: 0.04em; color: var(--muted); margin: 8px 0 4px; }
  h1 {
    font-family: var(--display);
    font-weight: 900;
    font-size: 1.7rem;
    margin: 0 0 4px;
    line-height: 1.2;
    display: inline-block;
    padding: 0 0.25em;
    background: linear-gradient(transparent 60%, var(--yellow) 60% 92%, transparent 92%);
  }
  .sub { color: var(--muted); margin: 6px 0 22px; }
  .frame {
    position: relative;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: 0 8px 22px rgba(120, 90, 0, 0.16);
    padding: 8px;
    min-height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .frame::before {
    content: "";
    position: absolute;
    top: -13px;
    left: 50%;
    width: 100px;
    height: 26px;
    margin-left: -50px;
    background: rgba(255, 210, 63, 0.85);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.14);
    transform: rotate(-2.5deg);
  }
  .frame img { width: 100%; height: auto; display: block; }
  .btn {
    display: inline-block;
    margin-top: 20px;
    background: var(--yellow);
    color: var(--ink);
    border: 2px solid var(--ink);
    box-shadow: 0 3px 0 var(--ink);
    border-radius: 999px;
    padding: 12px 32px;
    font-family: var(--sans);
    font-weight: 700;
    font-size: 1.1rem;
    text-decoration: none;
  }
  .hint { color: var(--muted); font-size: 0.9rem; margin-top: 14px; line-height: 1.4; }
  .state { color: var(--muted); padding: 40px 16px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <main>
    <p class="brand">Push'n'Pray</p>
    <h1 id="title">Your drawing</h1>
    <p class="sub" id="sub">Made together at the library</p>

    <div class="frame">
      <div class="state" id="state">Loading your drawing&hellip;</div>
      <img id="img" alt="Your drawing" hidden>
    </div>

    <a class="btn" id="save" hidden>Save image</a>
    <p class="hint" id="hint" hidden>Or press and hold the image, then choose <strong>Save to Photos</strong>.</p>
  </main>
  <script type="module" src="src/share.js"></script>
</body>
</html>
